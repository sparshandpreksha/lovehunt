<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jenny's Treasure Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600;700&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff6f91; --pink-d:#e0457b; --pink-l:#ffd6e2; --peach:#ffe8d9;
  --lav:#b9a6ff; --mint:#7fd8b0; --mint-d:#3fb684; --ink:#5b3a4b; --ink-l:#9a7486;
  --card:#fffaf8; --shadow:0 18px 50px -18px rgba(224,69,123,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#ffe0ea 0%,#fff0e4 45%,#eee6ff 100%) fixed;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer}
a{color:var(--pink-d)}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#hearts span{position:absolute;bottom:-40px;animation:rise linear infinite;opacity:.55}
@keyframes rise{
  0%{transform:translateY(0) translateX(0) rotate(0)}
  50%{transform:translateY(-55vh) translateX(25px) rotate(15deg)}
  100%{transform:translateY(-115vh) translateX(-15px) rotate(-10deg);opacity:0}
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.wrap{position:relative;z-index:1;max-width:580px;margin:0 auto;padding:18px 16px 120px}

/* ---------- header / trail ---------- */
header{text-align:center;margin-bottom:14px}
.brand{font-family:'Caveat',cursive;font-size:30px;font-weight:700;color:var(--pink-d);letter-spacing:.5px}
.brand span{display:inline-block;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.trail{display:flex;align-items:center;justify-content:space-between;margin:10px auto 0;position:relative;max-width:520px}
.trail::before{content:"";position:absolute;left:12px;right:12px;top:50%;border-top:3px dashed #f3b6c8;z-index:0}
.trail .fill{position:absolute;left:12px;top:calc(50% - 2px);height:4px;background:linear-gradient(90deg,var(--pink),var(--lav));border-radius:4px;z-index:0;transition:width 1s cubic-bezier(.6,.1,.2,1)}
.node{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:#fff;border:2.5px solid #f3c2d1;color:#d9a3b5;transition:all .4s}
.node.done{background:var(--pink);border-color:var(--pink);color:#fff;transform:scale(1.02)}
.node.cur{border-color:var(--pink);color:var(--pink-d);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,111,145,.55)}70%{box-shadow:0 0 0 12px rgba(255,111,145,0)}100%{box-shadow:0 0 0 0 rgba(255,111,145,0)}}
.pouch{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:12px;flex-wrap:wrap}
.pouch .lbl{font-size:12.5px;color:var(--ink-l);margin-right:4px}
.pl{width:22px;height:26px;border-radius:7px;border:2px dashed #f3c2d1;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,.6)}
.pl.f{border:0;background:linear-gradient(135deg,#ffb3c6,#ff7a9c);box-shadow:0 3px 0 #e78aa5}
.pl.new{animation:flipIn .8s cubic-bezier(.2,1.4,.4,1)}

/* ---------- card ---------- */
.card{
  background:var(--card);border-radius:28px;padding:26px 22px 24px;box-shadow:var(--shadow);
  border:2px solid #ffe1ea;position:relative;
}
.card.enter{animation:cardIn .75s cubic-bezier(.2,1.3,.4,1) both}
.card.exit{animation:cardOut .45s cubic-bezier(.6,0,.8,.2) both}
@keyframes cardIn{0%{opacity:0;transform:translateY(40px) scale(.9) rotate(-2deg);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
@keyframes cardOut{to{opacity:0;transform:translateY(-30px) scale(.92) rotate(3deg);filter:blur(6px)}}
.card.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px) rotate(-1deg)}40%,60%{transform:translateX(9px) rotate(1deg)}}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qnum{font-size:13px;font-weight:600;color:var(--pink-d);background:var(--pink-l);padding:5px 12px;border-radius:99px;letter-spacing:.4px}
.qemoji{font-size:54px;text-align:center;margin:8px 0 2px;animation:bob 2.6s ease-in-out infinite;display:block}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
h2{font-size:26px;text-align:center;margin:4px 0 6px;color:var(--ink)}
.lead{text-align:center;color:var(--ink-l);margin:0 0 18px;line-height:1.5;font-size:16.5px}

/* hint ring */
.hint{position:relative;width:62px;height:62px;flex:0 0 auto}
.hint svg{position:absolute;inset:0;transform:rotate(-90deg)}
.hint circle{fill:none;stroke-width:5}
.hint .bg{stroke:#ffe1ea}
.hint .fg{stroke:var(--lav);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.hint .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.05;color:var(--ink-l);font-weight:500}
.hint .lbl b{font-size:13.5px;color:var(--ink)}
.hint button{position:absolute;inset:4px;border-radius:50%;border:0;background:linear-gradient(135deg,#ffe36e,#ffb84d);font-size:12px;font-weight:700;color:#7a4a00;box-shadow:0 6px 16px -4px rgba(255,170,40,.7);animation:jiggle 2s infinite}
@keyframes jiggle{0%,80%,100%{transform:rotate(0) scale(1)}84%{transform:rotate(-12deg) scale(1.08)}88%{transform:rotate(12deg) scale(1.08)}92%{transform:rotate(-8deg)}96%{transform:rotate(6deg)}}
.hintbox{display:none;margin-top:16px;background:#fff8dc;border:2px solid #ffe08a;border-radius:18px;padding:12px 14px;font-size:15.5px;line-height:1.45;color:#6b5000}
.hintbox.show{display:block;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* answer form */
.answer{display:flex;gap:10px;margin-top:20px}
.answer input{
  flex:1;min-width:0;font:inherit;font-size:18px;padding:14px 16px;border-radius:18px;border:2.5px solid #ffd0de;
  background:#fff;color:var(--ink);outline:none;transition:border-color .2s, box-shadow .2s;text-transform:lowercase
}
.answer input:focus{border-color:var(--pink);box-shadow:0 0 0 5px rgba(255,111,145,.15)}
.answer input.bad{border-color:#ff5c7a;background:#fff3f5}
.btn{
  border:0;border-radius:18px;padding:14px 20px;font-size:17px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,var(--pink),#ff8fab);box-shadow:0 10px 22px -8px rgba(224,69,123,.7);
  transition:transform .15s, box-shadow .15s;white-space:nowrap
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px) scale(.97)}
.btn.big{display:block;margin:22px auto 0;padding:16px 34px;font-size:19px}
.btn.ghost{background:#fff;color:var(--pink-d);border:2px solid var(--pink-l);box-shadow:none}
.msg{min-height:22px;text-align:center;margin-top:10px;font-weight:500;color:#e0457b;font-size:15px}
.msg.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}

/* ---------- mascot ---------- */
#mascot{position:fixed;left:14px;bottom:14px;z-index:20;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
#mascot .face{font-size:46px;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12))}
#mascot .face.hop{animation:hop .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-28px) rotate(-12deg)}100%{transform:translateY(0)}}
#mascot .bubble{max-width:220px;background:#fff;border-radius:18px 18px 18px 4px;padding:9px 13px;font-size:14px;box-shadow:0 8px 20px -8px rgba(91,58,75,.35);margin-bottom:38px;opacity:0;transform:scale(.6) translateY(10px);transform-origin:bottom left;transition:all .35s cubic-bezier(.2,1.6,.4,1)}
#mascot .bubble.show{opacity:1;transform:none}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(255,220,232,.55);backdrop-filter:blur(6px);padding:16px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.modal .box{background:#fff;border-radius:30px;padding:30px 26px;text-align:center;max-width:360px;width:100%;box-shadow:var(--shadow);animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
.modal .stamp{font-size:64px;display:inline-block;animation:spinIn .8s cubic-bezier(.2,1.5,.4,1)}
@keyframes spinIn{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
.modal h3{font-size:26px;margin:8px 0 4px}
.modal p{color:var(--ink-l);margin:0;line-height:1.5}
.earned{margin:16px auto 0;display:flex;align-items:center;justify-content:center;gap:12px;font-size:14px;color:var(--ink-l)}
.earned b{width:54px;height:62px;border-radius:14px;display:grid;place-items:center;font-size:32px;color:#fff;background:linear-gradient(135deg,#ffb3c6,#ff6f91);box-shadow:0 5px 0 #e0457b;animation:flipIn 1s .35s cubic-bezier(.2,1.4,.4,1) both}

/* ---------- intro envelope ---------- */
.env{position:relative;width:min(300px,82vw);aspect-ratio:3/2;margin:40px auto 10px;cursor:pointer}
.env .back{position:absolute;inset:0;background:#ff9fb6;border-radius:14px}
.env .letter{position:absolute;left:6%;right:6%;top:8%;height:84%;background:#fffdf9;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.08);transition:transform 1s .5s cubic-bezier(.3,1.2,.5,1);display:grid;place-items:center;font-family:'Caveat',cursive;font-size:30px;color:var(--pink-d)}
.env .front{position:absolute;inset:0;border-radius:14px;z-index:2;
  background:linear-gradient(170deg,#ffc4d3,#ffadc2);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);
  filter:drop-shadow(0 -2px 2px rgba(200,60,100,.15))}
.env .flap{position:absolute;left:0;right:0;top:0;height:58%;transform-origin:top;z-index:3;transition:transform .7s cubic-bezier(.5,0,.3,1), z-index 0s .35s;
  background:linear-gradient(180deg,#ff8fab,#ff7a9c);clip-path:polygon(0 0,100% 0,50% 100%)}
.env .seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:4;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a9c,#d62f63);display:grid;place-items:center;font-size:24px;box-shadow:0 4px 10px rgba(160,20,60,.4);transition:all .4s}
.env:hover .seal{transform:translate(-50%,-50%) scale(1.1) rotate(-8deg)}
.env{transition:margin .9s .4s cubic-bezier(.3,1.2,.5,1)}
.env.open{margin-top:125px}
.env.open .seal{transform:translate(-50%,-50%) scale(0);opacity:0}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .letter{transform:translateY(-62%);z-index:1}
.tap{text-align:center;color:var(--ink-l);font-size:15px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.rules{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px}
.rules li{background:#fff4f7;border-radius:16px;padding:11px 14px;display:flex;gap:10px;align-items:flex-start;line-height:1.4;animation:cardIn .6s both}
.rules li span{font-size:20px}
.hand{font-family:'Caveat',cursive;font-size:25px;line-height:1.3;color:var(--ink)}

/* ---------- Q1 padlock ---------- */
.lockwrap{display:flex;flex-direction:column;align-items:center;transition:all .6s}
.lock{position:relative;width:min(300px,100%);padding-top:70px}
.shackle{position:absolute;left:50%;top:6px;width:130px;height:110px;margin-left:-65px;border:18px solid #e9b6c8;border-bottom:0;border-radius:70px 70px 0 0;transition:transform .7s cubic-bezier(.3,1.6,.5,1);box-shadow:inset 0 4px 0 rgba(255,255,255,.5)}
.lock.open .shackle{transform:translateY(-34px) rotate(-8deg);transform-origin:10% 100%}
.lbody{position:relative;background:linear-gradient(160deg,#ff9fb6,#ff6f91);border-radius:28px;padding:22px 14px 16px;box-shadow:0 14px 30px -10px rgba(224,69,123,.6), inset 0 3px 0 rgba(255,255,255,.35)}
.lock.open .lbody{animation:pop .6s}
.dials{display:flex;justify-content:center;align-items:center;gap:4px}
.dial{display:flex;flex-direction:column;align-items:center;gap:3px}
.dial button{border:0;background:rgba(255,255,255,.35);color:#fff;width:34px;height:24px;border-radius:9px;font-size:12px;transition:background .2s}
.dial button:hover{background:rgba(255,255,255,.6)}
.dial .win{width:34px;height:44px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--pink-d);overflow:hidden;box-shadow:inset 0 3px 6px rgba(0,0,0,.12)}
.dial .win span{display:block}
.dial .win span.up{animation:rollUp .25s}
.dial .win span.down{animation:rollDown .25s}
@keyframes rollUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes rollDown{from{transform:translateY(-100%)}to{transform:none}}
.dot{color:#fff;font-size:22px;font-weight:700;margin:0 2px;padding-top:4px}
.lcap{text-align:center;color:#fff;font-size:12px;letter-spacing:2px;margin-top:10px;opacity:.9}
.secret{display:none;margin-top:18px;width:100%}
.secret.show{display:block;animation:cardIn .8s both}

/* ---------- Q2 scratch ---------- */
.scratch{position:relative;border-radius:20px;overflow:hidden;height:190px;background:linear-gradient(135deg,#fff0f5,#f3edff);display:grid;place-items:center;text-align:center;padding:18px;touch-action:none}
.scratch .under{font-size:17px;line-height:1.5}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;transition:opacity .8s}

/* ---------- Q3 Mystic Falls ---------- */
.mf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mfc{background:linear-gradient(160deg,#3b0f1f,#6e1730);border:2px solid #c99a4a;border-radius:18px;padding:16px 8px 12px;text-align:center;font-size:32px;letter-spacing:3px;color:#ffe6b3;box-shadow:0 10px 24px -12px rgba(110,23,48,.8);animation:flipIn .7s cubic-bezier(.2,1.3,.4,1) both;transition:transform .25s, box-shadow .25s;position:relative;overflow:hidden}
.mfc::after{content:"";position:absolute;top:-6px;left:22%;width:9px;height:22px;background:#b3123a;border-radius:0 0 50% 50%;animation:drip 3.5s infinite}
@keyframes drip{0%,60%{height:0}80%{height:22px}100%{height:22px;opacity:0}}
.mfc:hover{transform:translateY(-4px) rotate(-1.5deg);box-shadow:0 14px 30px -10px rgba(179,18,58,.9)}
.mfc small{display:block;font-family:'Cinzel',serif;font-size:12px;letter-spacing:2px;color:#c99a4a;margin-top:8px}
@keyframes flipIn{0%{opacity:0;transform:rotateY(90deg) scale(.8)}100%{opacity:1;transform:none}}
.mftitle{font-family:'Cinzel',serif;text-align:center;color:#6e1730;font-size:13px;letter-spacing:3px;margin:-6px 0 14px}

/* ---------- Q4 rows ---------- */
.rows{display:grid;gap:14px}
.row{background:#fff;border:2px solid #ffe1ea;border-radius:18px;padding:12px;transition:all .3s;animation:cardIn .6s both}
.row.ok{border-color:var(--mint);background:#f0fbf6}
.row p{margin:0 0 9px;font-size:14.5px;color:var(--ink-l)}
.row p b{color:var(--pink-d)}
.row.wordle{border-color:#c9e7c0;background:#f7fdf4}
.row.wordle p b{color:#4a9a3a}
.cells{display:flex;gap:6px;justify-content:center}
.cells input{width:42px;height:46px;text-align:center;font:inherit;font-size:21px;font-weight:600;text-transform:uppercase;border-radius:12px;border:2.5px solid #ffd0de;background:#fff;color:var(--ink);outline:none;padding:0;transition:all .2s}
.cells input:focus{border-color:var(--pink);transform:translateY(-2px)}
.cells input.glow{background:#fff3c4;border-color:#ffc94d;animation:glow 2s infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,201,77,.6)}70%{box-shadow:0 0 0 8px rgba(255,201,77,0)}100%{box-shadow:0 0 0 0 rgba(255,201,77,0)}}
.row.ok .cells input{border-color:var(--mint);animation:flip .5s both}
.row.ok .cells input.glow{background:#ffe680}
.row.wordle.ok .cells input{background:#6aaa64;border-color:#6aaa64;color:#fff}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}

/* ---------- Q5 slider ---------- */
.slider{position:relative;width:min(300px,100%);aspect-ratio:1;margin:0 auto;border-radius:18px;overflow:hidden;background:#ffe1ea;box-shadow:inset 0 0 0 3px #ffd0de}
.tile{position:absolute;width:33.333%;height:33.333%;background-size:300% 300%;border-radius:8px;transition:transform .22s cubic-bezier(.3,1.3,.5,1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.7);cursor:pointer}
.slider.solved .tile{box-shadow:none;border-radius:0;cursor:default}
.slider.solved{animation:pop .6s}
.moves{text-align:center;color:var(--ink-l);font-size:14px;margin-top:8px}

/* ---------- Q6 map ---------- */
.map{background:radial-gradient(circle at 20% 20%,#fff8e6,#fbe7c3);border-radius:20px;padding:22px 20px;border:3px solid #ecc98c;position:relative;overflow:hidden}
.map .x{position:absolute;right:18px;bottom:12px;font-size:34px;color:#d62f63;font-weight:700;animation:wob 1.5s infinite}
@keyframes wob{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(10deg) scale(1.2)}}

/* ---------- Q7 morse ---------- */
.morse{background:#2e2240;color:#ffd6e2;border-radius:20px;padding:18px;text-align:center;font-family:'Courier New',monospace;font-size:22px;font-weight:700;letter-spacing:2px;line-height:1.8;word-break:break-word}
.morse .on{color:#ffe36e;text-shadow:0 0 10px #ffe36e}
.play{display:flex;justify-content:center;margin-top:12px}
.song{margin-top:14px;text-align:center;background:linear-gradient(135deg,#fff0f5,#ffe8d9);border-radius:18px;padding:12px;font-size:15px;color:var(--ink-l)}
.song b{display:block;font-size:22px;color:var(--pink-d);margin-top:2px}
.song .eq{display:inline-flex;gap:3px;height:16px;align-items:flex-end;margin-left:6px;vertical-align:middle}
.song .eq i{width:4px;background:var(--pink);border-radius:2px;animation:eq .8s infinite ease-in-out}
.song .eq i:nth-child(2){animation-delay:.2s}.song .eq i:nth-child(3){animation-delay:.4s}.song .eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}

/* ---------- Q8 poem ---------- */
.poem{font-family:'Caveat',cursive;font-size:24px;line-height:1.4;color:#b07a90;background:#fffafc;border-radius:18px;padding:16px 18px;border:2px solid #ffe1ea}
.poem .b{color:#8e0f3e;font-weight:700}

/* ---------- Q9 quiz ---------- */
.quiz{display:grid;gap:14px}
.qq{background:#fff;border:2px solid #ffe1ea;border-radius:18px;padding:12px;animation:cardIn .6s both}
.qq p{margin:0 0 9px;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid #ffd0de;background:#fff;border-radius:99px;padding:7px 14px;font-size:15px;color:var(--ink);transition:all .2s}
.opt:hover{border-color:var(--pink)}
.opt.sel{background:var(--pink);border-color:var(--pink);color:#fff;transform:scale(1.06)}
.score{display:flex;justify-content:center;gap:8px;margin-top:14px;font-size:26px}
.score span{transition:transform .3s}
.score span.on{animation:pop .4s}

/* ---------- Q10 finale ---------- */
.slots{display:flex;gap:8px;justify-content:center;margin:16px 0 0;flex-wrap:wrap}
.slot{width:42px;height:48px;border-radius:12px;border:2.5px dashed #ffb3c6;display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--pink-d);background:#fff;text-transform:uppercase;transition:all .25s}
.slot.f{border-style:solid;border-color:var(--pink);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.slot.gap{margin-left:14px}
.slot.click{cursor:pointer}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px;min-height:52px}
.lt{width:44px;height:48px;border-radius:12px;border:0;background:linear-gradient(135deg,#ffc2d4,#ffa2bd);color:#fff;font-size:22px;font-weight:700;text-transform:uppercase;box-shadow:0 5px 0 #e78aa5;transition:transform .15s;animation:pop .4s both}
.lt:active{transform:translateY(3px);box-shadow:0 2px 0 #e78aa5}

/* finale */
.final .big{font-size:84px;text-align:center;animation:beat 1.4s infinite}
.final .letterbox{background:#fffdf9;border-radius:20px;padding:20px;box-shadow:inset 0 0 0 2px #ffe1ea;margin-top:10px}
.dress{font-size:60px;text-align:center;margin-top:8px;animation:sway 2.4s ease-in-out infinite;transform-origin:50% 0}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.restart{border:0;background:none;color:var(--ink-l);font-size:13px;padding:6px 10px;border-radius:99px;opacity:.75;transition:all .2s}
.restart:hover{opacity:1;background:#fff4f7;color:var(--pink-d)}
.stats{display:flex;gap:10px;justify-content:center;margin-top:16px}
.stat{background:#fff4f7;border-radius:16px;padding:10px 14px;text-align:center;font-size:13px;color:var(--ink-l)}
.stat b{display:block;font-size:22px;color:var(--pink-d)}

/* ---------- yes / no ask ---------- */
.ask{text-align:center;padding-top:30px;padding-bottom:34px}
.askface{font-size:76px;display:inline-block;animation:bob 2s ease-in-out infinite}
.ask h2{font-family:'Caveat',cursive;font-size:42px;color:var(--pink-d);line-height:1.1;margin:10px 0 6px}
.askbtns{display:flex;justify-content:center;align-items:center;gap:36px;margin-top:26px;min-height:90px}
.yes{font-size:21px;padding:16px 38px;transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.no{font-size:18px;padding:12px 26px;transition:left .28s cubic-bezier(.3,1.4,.5,1), top .28s cubic-bezier(.3,1.4,.5,1)}
.no{min-width:120px}
.no.wig{animation:nope .5s}
@keyframes nope{20%{transform:translateX(-6px) rotate(-6deg)}40%{transform:translateX(6px) rotate(6deg)}60%{transform:translateX(-4px) rotate(-3deg)}80%{transform:translateX(3px)}}
body.nocur, body.nocur *{cursor:none!important}
#fcur{position:fixed;left:0;top:0;width:24px;height:30px;pointer-events:none;z-index:100;transform-origin:3px 2px;will-change:transform}

@media (max-width:420px){
  .card{padding:22px 16px 20px;border-radius:24px}
  h2{font-size:23px}
  .node{width:25px;height:25px;font-size:11px}
  .cells input{width:36px;height:42px;font-size:19px}
  .answer{flex-direction:column}
  .slot,.lt{width:34px;height:42px;font-size:19px}
  .slot.gap{margin-left:6px}
  .dial button,.dial .win{width:30px}
  #mascot .face{font-size:38px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };
const norm = s => (s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const cyrb53=(s,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36);};
const isRight = (key, val) => cyrb53('luv|'+key+'|'+norm(val),1337) === HASH[key];
const letterFor = (n, ans) => String.fromCharCode(ENC[n] ^ (parseInt(cyrb53('ltr|'+n+'|'+norm(ans),7).slice(-3),36)&31));

/* ================= confetti ================= */
const fx = $('#fx'), ctx = fx.getContext('2d');
let parts = [], fxRunning = false;
function sizeFx(){ fx.width = innerWidth*devicePixelRatio; fx.height = innerHeight*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener('resize', sizeFx); sizeFx();
function burst(n=90, x=innerWidth/2, y=innerHeight/2.4){
  const shapes=['❤','✿','★','●','♥'], cols=['#ff6f91','#ffb3c6','#b9a6ff','#ffd166','#7fd8b0','#ff8fab'];
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = 4+Math.random()*9;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,
      s:12+Math.random()*16,c:cols[i%cols.length],t:shapes[i%shapes.length],life:120+Math.random()*60});
  }
  if(!fxRunning){ fxRunning = true; requestAnimationFrame(tick); }
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p => p.life-- > 0 && p.y < innerHeight+40);
  for(const p of parts){
    p.vy += .22; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1,p.life/40);
    ctx.fillStyle = p.c; ctx.font = p.s+'px sans-serif'; ctx.fillText(p.t,-p.s/2,p.s/2); ctx.restore();
  }
  if(parts.length) requestAnimationFrame(tick); else { fxRunning=false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}

/* ================= sound ================= */
let AC;
function tone(f, d=.15, t=0, type='sine', vol=.18){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), now = AC.currentTime + t;
    o.type = type; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(vol, now+.01); g.gain.exponentialRampToValueAtTime(.001, now+d);
    o.start(now); o.stop(now+d+.05);
  }catch(e){}
}
const chime = () => [523,659,784,1047].forEach((f,i)=>tone(f,.35,i*.09,'triangle'));
const boop  = () => { tone(300,.15,0,'square',.06); tone(220,.2,.1,'square',.06); };

function drawTrail(newLetter){
  const t = $('#trail'); t.innerHTML = '';
  const fill = el('div','fill'); t.appendChild(fill);
  for(let i=1;i<=10;i++){
    t.appendChild(el('div','node' + (i < S.stage ? ' done' : i===S.stage ? ' cur' : ''), i < S.stage ? '♥' : i));
  }
  const done = Math.max(0, Math.min(9, S.stage-1));
  requestAnimationFrame(()=> fill.style.width = `calc(${done/9*100}% - ${done/9*24}px)`);
  const p = $('#pouch'); p.innerHTML = '';

  p.appendChild(el('span','lbl','🔑 secret letters'));

    const L = S.letters[i];
    p.appendChild(el('div','pl'+(L?' f':'')+(i===newLetter?' new':''), L||''));
  }
}

  emoji:'🎤', title:'How Well Do You Know Us?',
  lead:'Four questions about us.<br>You\'ll find out how many you got right. Get all four!',
  hint:'Think back to Kolkata, Delhi and Zoopy 🧸 Every answer is from your own story together.',
  custom:true,
  render(b, api){
    const Q = [
      ['q1','Where did we first meet in person?', ['Delhi','Mumbai','Kolkata','Jaipur']],
      ['q2','What was the first thing we ate together?', ['Momos','Pizza','Tacos','Chole Bhature']],
      ['q3','Who said "I love you" first?', ['Jenny','Sparsh','Both at the same time','Still waiting 😤']],
      ['q4','What\'s the name of our soft toy?', ['Teddy','Mr. Fluffy','Zoopy','Bubbles']],
    ];
    const picks = Array(Q.length).fill(null);
    const quiz = el('div','quiz'), score = el('div','score');
    Q.forEach(([key,q,opts],qi)=>{
      const d = el('div','qq'); d.style.animationDelay=(qi*.08)+'s';
      d.innerHTML = `<p>${qi+1}. ${q}</p>`;
      const o = el('div','opts');
      opts.forEach(t=>{
        const btn = el('button','opt',t);
        btn.onclick = () => { o.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); btn.classList.add('sel'); picks[qi]=t; tone(700,.08,0,'triangle',.08); };
        o.appendChild(btn);
      });
      d.appendChild(o); quiz.appendChild(d);
    });
    b.appendChild(quiz);
    const go = el('button','btn big','Check my answers 💘');
    go.onclick = () => {
      if(picks.some(p=>!p)) { api.msg('Answer all four first 😌'); return; }
      const right = Q.map(([key],i)=>isRight(key,picks[i]));
      const n = right.filter(Boolean).length;
      score.innerHTML = Q.map((_,i)=>`<span>${i<n?'💖':'🤍'}</span>`).join('');
      if(n===Q.length) api.win(picks.join(''));
      else api.fail(`${n} / ${Q.length} right. Fix the others 😌`);
    };
    b.appendChild(go); b.appendChild(score);
  }
},
{ // quest 10
  emoji:'🗝️', title:'The Final Lock',
  lead:'Remember those secret letters you collected?<br>Unscramble them to open your surprise.',
  hint:'Two words. It\'s what tonight is 💌',
  custom:true,
  render(b, api){
    const letters = [];
    for(let i=1;i<=9;i++) letters.push(S.letters[i] || '?');
    const bag = letters.map((l,i)=>({l,id:i})).sort(()=>Math.random()-.5);
    const slots = el('div','slots'), tiles = el('div','tiles');
    const placed = Array(9).fill(null);
    function draw(){
      slots.innerHTML=''; tiles.innerHTML='';
      placed.forEach((p,i)=>{
        const s = el('div','slot click'+(p?' f':'')+(i===4?' gap':''), p?p.l:'');
        s.onclick = () => { if(placed[i]){ placed[i]=null; draw(); tone(400,.06,0,'triangle',.06);} };
        slots.appendChild(s);
      });
      bag.filter(t=>!placed.includes(t)).forEach(t=>{
        const btn = el('button','lt',t.l);
        btn.onclick = () => { const e = placed.indexOf(null); if(e<0) return; placed[e]=t; draw(); tone(600+e*40,.08,0,'triangle',.08);
          if(!placed.includes(null)) setTimeout(()=>api.check(placed.map(p=>p.l).join('')), 350); };
        tiles.appendChild(btn);
      });
    }
    draw(); b.appendChild(slots); b.appendChild(tiles);
    b.appendChild(el('p','lead','<small>Tap a letter to place it, tap a box to take it back.</small>'));
  }
}
];
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

/* ================= renderer ================= */
let timer;
function render(newLetter){
  clearInterval(timer);
  drawTrail(newLetter);
  const app = $('#app'); app.innerHTML='';
  if(S.stage===0) return S.yes ? renderIntro(app) : renderAsk(app);
  if(S.stage>10) return renderEnd(app);

  const n = S.stage, q = QUESTS[n];
  if(!S.start[n]){ S.start[n] = Date.now(); save(); }
  const card = el('section','card enter');
  card.innerHTML = `
    <div class="card-top"><span class="qnum">QUEST ${n} / 10</span>
      <div class="hint"><svg viewBox="0 0 62 62"><circle class="bg" cx="31" cy="31" r="27"/><circle class="fg" cx="31" cy="31" r="27"/></svg><div class="lbl"></div></div></div>
    <span class="qemoji">${q.emoji}</span><h2>${q.title}</h2><p class="lead">${q.lead}</p>
    <div class="qbody"></div>`;
  const body = $('.qbody',card), msg = el('div','msg'), hb = el('div','hintbox', '💡 '+q.hint);
  const api = {
    msg(t){ msg.textContent=t; msg.classList.remove('pop'); void msg.offsetWidth; msg.classList.add('pop'); },
    fail(t){
      card.classList.remove('shake','enter'); void card.offsetWidth; card.classList.add('shake');
      boop(); t = t || pick(NOPE); api.msg(t); say(t, 2600);
      const inp = $('.answer input',card); if(inp){ inp.classList.add('bad'); setTimeout(()=>inp.classList.remove('bad'),900); }
    },
    check(val){ return isRight(n,val) ? win(card, val) : api.fail(); },
    win(val){ win(card, val); },
    addForm(guard){
      const f = el('form','answer');
      f.innerHTML = `<input placeholder="type the secret word…" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn">Unlock ✨</button>`;
      f.onsubmit = e => { e.preventDefault(); const v = $('input',f).value; if(!norm(v)) return api.msg('Type something first 😌'); if(guard && !guard(v)) return; api.check(v); };
      body.after(f);
      f.style.animation = 'cardIn .6s both';
    }
  };
  q.render(body, api);
  if(!q.custom) api.addForm();
  card.appendChild(msg); card.appendChild(hb);
  app.appendChild(card);

  // hint timer
  const fg = $('.fg',card), lbl = $('.lbl',card), C = 2*Math.PI*27;
  fg.style.strokeDasharray = C;
  if(S.hints[n]) hb.classList.add('show');
  const upd = () => {
    const left = Math.max(0, CFG.hintDelay - Math.floor((Date.now()-S.start[n])/1000));
    fg.style.strokeDashoffset = C * (left/CFG.hintDelay);
    if(left>0){ lbl.innerHTML = `<div>hint in<br><b>${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</b></div>`; }
    else {
      clearInterval(timer);
      const wrap = $('.hint',card);
      if(S.hints[n]){ wrap.innerHTML = '<div class="lbl"><div style="font-size:26px">💡</div></div>'; return; }
      wrap.innerHTML = ''; const btn = el('button',null,'💡<br>HINT'); wrap.appendChild(btn);
      say('Psst… a hint just unlocked 💡', 3500);
      btn.onclick = () => { S.hints[n]=true; save(); hb.classList.add('show'); tone(990,.2,0,'triangle'); wrap.innerHTML='<div class="lbl"><div style="font-size:26px">💡</div></div>'; };
    }
  };
  upd(); timer = setInterval(upd, 1000);
  const firstInput = $('.answer input',card);
  if(firstInput && matchMedia('(pointer:fine)').matches) setTimeout(()=>firstInput.focus(), 700);
}

function win(card, val){
  clearInterval(timer);
  const n = S.stage;
  S.ans[n] = norm(val);
  let L = null;
  if(ENC[n]){ L = letterFor(n, val); S.letters[n] = L; }
  S.stage = n+1;
  if(S.stage>10) S.ended = Date.now();
  save();
  chime(); burst(130); say(pick(YAY), 3000);
  const mins = Math.max(1, Math.round((Date.now()-S.start[n])/60000));
  const m = el('div','modal');
  m.innerHTML = `<div class="box"><div class="stamp">${n===10?'👑':'🏅'}</div>
    <h3>Quest ${n} cracked!</h3><p>${n===10?'You opened the final lock…':`Solved in about ${mins} min${mins>1?'s':''}. ${10-n} more to go 💪`}</p>
    ${L?`<div class="earned">You earned a secret letter <b>${L}</b></div>`:''}
    <button class="btn big">${n===10?'Open your surprise 💝':'Next quest →'}</button></div>`;
  document.body.appendChild(m);
  $('button',m).onclick = () => {
    m.style.transition='opacity .3s'; m.style.opacity=0; setTimeout(()=>m.remove(),300);
    card.classList.remove('enter','shake'); card.classList.add('exit');
    setTimeout(()=>{ render(n); scrollTo({top:0,behavior:'smooth'}); }, 420);
  };
}

function renderAsk(app){
  const card = el('section','card enter ask');
  card.innerHTML = `<div class="askface">🥺</div>
    <h2>${CFG.herName}, will you go on a date with me tonight?</h2>
    <p class="lead">choose wisely 👀</p>
    <div class="askbtns"><button class="btn yes">Yes 💗</button><button class="btn ghost no" tabindex="-1">No</button></div>`;
  app.appendChild(card);
  const yes = $('.yes',card), no = $('.no',card);
  const NO_TXT = ['No','Are you sure?','Really?? 🥺','Think again','Pleaseee','Not an option 😤','Error 404 🤭','Nice try','Just press Yes'];
  const NO_SAY = ['Nice try 😌','Nope, that button is shy 🙈','It\'s scared of you 😂','Sparsh said No isn\'t allowed 😤','Just press Yes, Baby 💗','The cursor refuses 🙅‍♀️'];
  let teases = 0, lastTease = 0, lx = 0, ly = 0;

  // fake cursor that dangles around the No button but never lands on it
  const fc = el('div'); fc.id = 'fcur'; fc.style.display = 'none';
  fc.innerHTML = `<svg viewBox="0 0 24 30" width="24" height="30"><path d="M3 2 L3 24 L8.5 18.5 L12.5 27.5 L16 26 L12 17 L20 17 Z" fill="#fff" stroke="#3a2230" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
  document.body.appendChild(fc);
  const fine = matchMedia('(pointer:fine)').matches;
  if(fine) document.body.classList.add('nocur');
  let mx=-200, my=-200, cx=-200, cy=-200, vx=0, vy=0, ang=0, t=0, raf;

  function tease(force){
    const now = Date.now();
    if(!force && now - lastTease < 1100) return;
    lastTease = now; teases++;
    no.textContent = NO_TXT[teases % NO_TXT.length];
    no.classList.remove('wig'); void no.offsetWidth; no.classList.add('wig');
    yes.style.transform = `scale(${Math.min(1.2, 1 + teases*.03)})`;
    tone(1100 + Math.random()*500, .06, 0, 'triangle', .06);
    if(teases % 2 === 1) say(NO_SAY[Math.floor(teases/2) % NO_SAY.length], 2200);
  }
  const onMove = e => { mx = e.clientX; my = e.clientY; if(fine) fc.style.display = 'block'; };
  addEventListener('pointermove', onMove);
  // even if the real (hidden) pointer sneaks onto it, No never does anything but tease
  no.addEventListener('pointerdown', e => { e.preventDefault(); tease(true); });
  no.addEventListener('click', e => { e.preventDefault(); });

  (function loop(){
    t++;
    // No's resting rect (without its lean)
    const br = no.getBoundingClientRect();
    const r = {left:br.left-lx, right:br.right-lx, top:br.top-ly, bottom:br.bottom-ly};
    const M = 30, E = {left:r.left-M, right:r.right+M, top:r.top-M, bottom:r.bottom+M};
    const ncx = (r.left+r.right)/2, ncy = (r.top+r.bottom)/2;
    const inside = mx > E.left && mx < E.right && my > E.top && my < E.bottom;
    const dist = Math.hypot(mx-ncx, my-ncy), near = dist < 150;
    let tx = mx, ty = my;
    if(inside){
      // slide along the nearest edge of the forbidden zone, wobbling
      const dL = mx-E.left, dR = E.right-mx, dT = my-E.top, dB = E.bottom-my, m = Math.min(dL,dR,dT,dB);
      if(m===dL) tx = E.left - 6; else if(m===dR) tx = E.right + 6; else if(m===dT) ty = E.top - 6; else ty = E.bottom + 6;
      tx += Math.sin(t*.3)*7; ty += Math.cos(t*.27)*7;
      tease();
    }
    if(near){ vx += (tx-cx)*.2; vy += (ty-cy)*.2; vx *= .68; vy *= .68; cx += vx; cy += vy; }
    else { cx = tx; cy = ty; vx = vy = 0; }
    // never let the drawn arrow tip enter the zone
    if(cx > E.left && cx < E.right && cy > E.top && cy < E.bottom){
      const dL = cx-E.left, dR = E.right-cx, dT = cy-E.top, dB = E.bottom-cy, m = Math.min(dL,dR,dT,dB);
      if(m===dL) cx = E.left; else if(m===dR) cx = E.right; else if(m===dT) cy = E.top; else cy = E.bottom;
    }
    const target = inside ? Math.sin(t*.2)*38 + Math.max(-30, Math.min(30, vx*3)) : near ? Math.sin(t*.15)*10 : 0;
    ang += (target - ang) * .18;
    fc.style.transform = `translate(${cx-3}px,${cy-2}px) rotate(${ang}deg)`;
    // the No button leans shyly away from the cursor
    const k = near ? (150 - dist)/150 : 0;
    const tlx = -(mx-ncx)/(dist||1) * 12 * k, tly = -(my-ncy)/(dist||1) * 8 * k;
    lx += (tlx - lx)*.2; ly += (tly - ly)*.2;
    no.style.translate = `${lx}px ${ly}px`;
    no.style.rotate = `${-lx*.8}deg`;
    raf = requestAnimationFrame(loop);
  })();

  setTimeout(()=>say(`Psst ${CFG.herName}… there's only one right answer 👀`, 3500), 900);
  yes.onclick = () => {
    cancelAnimationFrame(raf); removeEventListener('pointermove', onMove);
    fc.remove(); no.remove(); document.body.classList.remove('nocur');
    S.yes = true; save(); chime(); burst(150);
    say('YAYYY 🥳 I knew it!', 2500);
    card.classList.remove('enter'); card.classList.add('exit');
    setTimeout(render, 600);
  };
}

function renderIntro(app){
  const card = el('section','card enter');
  card.innerHTML = `
    <h2 style="font-family:Caveat,cursive;font-size:40px;color:var(--pink-d);margin-top:6px">Hey ${CFG.herName} 💌</h2>
    <p class="lead">Someone left you a letter…</p>
    <div class="env" id="env"><div class="back"></div><div class="letter">for you, ${CFG.petName} ♡</div><div class="flap"></div><div class="front"></div><div class="seal">💗</div></div>
    <p class="tap" id="tapmsg">tap the seal to open</p>
    <div id="rest" style="display:none">
      <p class="hand" style="text-align:center">Tonight isn't an ordinary night.<br>Before you get your surprise, you'll have to <b>earn it</b>. 😌</p>
      <ul class="rules">
        <li style="animation-delay:.05s"><span>🗝️</span><div><b>10 quests.</b> Each one locks the next. No answer, no way forward.</div></li>
        <li style="animation-delay:.15s"><span>🔑</span><div>Every quest you solve gives you a <b>secret letter</b>. Keep them safe, you'll need them at the end.</div></li>
        <li style="animation-delay:.25s"><span>💡</span><div>Stuck? A <b>hint unlocks after 2 minutes</b> on every quest.</div></li>
        <li style="animation-delay:.35s"><span>📱</span><div>Keep your phone charged. Some answers can only come from <b>${CFG.hisName}</b>.</div></li>
      </ul>
      <button class="btn big" id="go">Let the hunt begin 🏹</button>
    </div>`;
  app.appendChild(card);
  const env = $('#env',card);
  env.onclick = () => {
    if(env.classList.contains('open')) return;
    env.classList.add('open'); $('#tapmsg',card).remove(); tone(660,.15); tone(880,.2,.12);
    setTimeout(()=>{ burst(60, innerWidth/2, innerHeight/3); $('#rest',card).style.display='block'; $('#rest',card).style.animation='cardIn .7s both'; }, 1100);
  };
  setTimeout(()=>say(`Hiii ${CFG.herName}! I'm ${CFG.mascot}, your guide tonight 🐻`, 4000), 900);
  card.addEventListener('click', e => {
    if(e.target.id!=='go') return;
    S.stage = 1; S.began = S.began || Date.now(); save();
    card.classList.remove('enter'); card.classList.add('exit');
    setTimeout(render, 420);
  });
}

function renderEnd(app){
  const total = S.began && S.ended ? Math.round((S.ended-S.began)/60000) : '—';
  const hints = Object.keys(S.hints).length;
  const card = el('section','card enter final');
  card.innerHTML = `<div class="big">💝</div>
    <h2 style="font-family:Caveat,cursive;font-size:42px;color:var(--pink-d)">You did it, ${CFG.petName}!</h2>
    <div class="letterbox hand" style="text-align:center">
      Ten quests, ten little pieces of us… and you cracked every single one. 🥹<br><br>
      Now, one last mission:<br>
      go change into <b style="color:#d62f63">that red dress</b> ❤️<br>
      and <b>video call me</b>.<br><br>
      Our date starts <i>now</i>.<br><br>
      — Your ${CFG.hisName} 💗</div>
    <div class="dress">💃</div>
    <div class="stats"><div class="stat"><b>10/10</b>quests</div><div class="stat"><b>${total}</b>minutes</div><div class="stat"><b>${hints}</b>hints used</div></div>
    <div style="text-align:center;margin-top:18px"><button class="restart" id="restart">↺ play again</button></div>`;
  app.appendChild(card);
  $('#restart',card).onclick = () => {
    if(!confirm('Start the whole treasure hunt again from the very beginning?')) return;
    S = fresh(); save();
    card.classList.remove('enter'); card.classList.add('exit');
    setTimeout(()=>{ render(); scrollTo({top:0,behavior:'smooth'}); }, 420);
  };
  let k=0; const iv = setInterval(()=>{ burst(60, Math.random()*innerWidth, innerHeight*0.3); if(++k>6) clearInterval(iv); }, 600);
  say('Go go go! He\'s waiting 📹💗', 6000);
}

render();
</script>
